<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Weather App</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light">
      <div class="container">
        <!-- Add logo above Weather App title -->
        <div class="navbar-brand-logo">
    </nav>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand text-primary" href="#">WeatherApp</a>
        <form class="d-flex ms-auto">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search city..."
            aria-label="Search"
            id="citySearch"
          />
          <button
            class="btn btn-outline-primary"
            type="button"
            id="searchButton"
          >
            Search
          </button>
        </form>
      </div>
    </nav>

    <!-- Weather Section -->
    <div class="container my-5">
      <h1 class="my-4 text-center text-primary">
        Weather Details: <span id="CityName">--</span>
      </h1>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow">
            <div class="card-header text-white bg-primary">
              <h4 class="my-0 fw-normal">Temperature</h4>
            </div>
            <div class="card-body">
              <h5>Temperature: <span id="Temperature">--</span></h5>
              <h5>Wind Speed: <span id="Wind_speed">--</span></h5>
              <h5>Humidity: <span id="Humidity">--</span></h5>
              <h5>Pressure: <span id="Pressure">--</span></h5>
            </div>
          </div>
        </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Last Seen Weather Section -->
    <div class="container my-5">
      <h2 class="text-center text-primary">Last Seen Weather</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped text-center">
          <thead class="bg-primary text-white">
            <tr>
              <th>City</th>
              <th>Temperature</th>
              <th>Wind Speed</th>
              <th>Humidity</th>
              <th>Pressure</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="LastSeenCity">--</td>
              <td id="LastSeenTemp">--</td>
              <td id="LastSeenWindSpeed">--</td>
              <td id="LastSeenHumidity">--</td>
              <td id="LastSeenPressure">--</td>
              <td id="LastSeenTime">--</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer class="text-center py-4">
      <p>&copy; 2025 WeatherApp. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
